[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agno-docs-mcp"
version = "0.1.0"
description = "MCP server exposing Agno framework documentation via FTS5-powered search"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Gonzalo Recalde", email = "gonzalo@agno.ai"},
]
keywords = ["agno", "mcp", "model-context-protocol", "fts5", "documentation", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "mcp>=1.0,<2.0",
    "pydantic>=2.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
mcp-agno-docs = "mcp_agno_docs.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agno_docs"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "--cov=src/mcp_agno_docs --cov-fail-under=80"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
