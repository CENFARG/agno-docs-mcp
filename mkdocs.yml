site_name: agno-docs-mcp
site_description: MCP server exposing Agno framework documentation via FTS5-powered full-text search
site_author: Gonzalo Recalde
repo_url: https://github.com/CENFARG/agno-docs-mcp
repo_name: CENFARG/agno-docs-mcp
edit_uri: edit/main/docs/
copyright: "&copy; 2026 Gonzalo Recalde · Apache 2.0"

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Tutorials:
      - "Getting Started": getting-started.md
  - How-To Guides:
      - "Search Documentation": how-to/search-docs.md
      - "Get a Page": how-to/get-page.md
      - "Browse Navigation": how-to/browse-navigation.md
      - "Use Topic Filter": how-to/use-topic-filter.md
  - Reference:
      - "Tools API": reference/tools-api.md
      - "Configuration": reference/configuration.md
      - "Architecture": reference/architecture.md
      - "FTS5 Schema": reference/fts5-schema.md
  - Explanation:
      - "Why FTS5?": explanation/why-fts5.md
      - "Hexagonal Architecture": explanation/hexagonal-architecture.md
      - "Design Decisions": explanation/design-decisions.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
