name: "Bug Report"
description: "Report a bug in agno-docs-mcp"
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out this form carefully —
        the more details you provide, the faster we can fix it.

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "What happened? What did you expect to happen?"
      placeholder: "A clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Minimal steps to trigger the bug."
      placeholder: |
        1. Start the MCP server with `mcp-agno-docs /path/to/docs`
        2. Call `search_docs` with query `"..."`
        3. Observe incorrect result / error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What should have happened?"
      placeholder: "The search should return ..."

  - type: textarea
    id: logs
    attributes:
      label: "Logs and Error Output"
      description: "Paste the full error message, traceback, or MCP JSON-RPC output."
      render: text

  - type: input
    id: version
    attributes:
      label: "Package Version"
      description: "Run `pip show agno-docs-mcp` or `mcp-agno-docs --version`."
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: "Python Version"
      description: "Run `python --version`."
      placeholder: "Python 3.12.3"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: "MCP Client"
      description: "Which MCP client are you using?"
      options:
        - Claude Desktop
        - OpenCode
        - Cursor
        - Windsurf
        - Other (describe in bug report)

  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Anything else that might help? Screenshots, doc repo size, FTS5 index size, etc."
